name: Deploy Monitoring

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build Monitoring Image
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://agentlytics.duckdns.org/api' }}
          NEXT_PUBLIC_BASE_PATH: /monitoring
        run: docker compose build monitoring

      - name: Push Monitoring Image
        run: docker compose push monitoring

      - name: Deploy to OVH Cloud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OVH_HOST || secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.OVH_USERNAME || 'ubuntu' }}
          password: ${{ secrets.OVH_PASSWORD || secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            mkdir -p ~/agentlytics/monitoring
            cat << 'EOF' > ~/agentlytics/monitoring/docker-compose.yml
            services:
              monitoring:
                image: itzdineshyadav/data-analyzer:monitoring
                container_name: data-analyzer-monitoring
                restart: unless-stopped
                ports:
                  - "3001:3001"
            EOF

            echo "Stopping old monitoring container..."
            docker stop data-analyzer-monitoring 2>/dev/null || true
            docker rm data-analyzer-monitoring 2>/dev/null || true
            docker rmi itzdineshyadav/data-analyzer:monitoring 2>/dev/null || true

            echo "Pulling latest monitoring image..."
            docker pull itzdineshyadav/data-analyzer:monitoring

            echo "Starting monitoring container..."
            cd ~/agentlytics/monitoring
            docker compose up -d

            echo "Monitoring deployment completed successfully."
