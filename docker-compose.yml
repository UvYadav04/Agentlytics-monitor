services:
  monitoring:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://agentlytics.duckdns.org/api}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/monitoring}
    image: itzdineshyadav/data-analyzer:monitoring
    container_name: data-analyzer-monitoring
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONITORING_TRACES_DIR=/app/traces
      - MONITORING_DB_PATH=/app/traces/traces.db
      - API_URL=${API_URL:-http://host.docker.internal:8000/api}
    volumes:
      - ../Server/traces:/app/traces
      - ../Server/traces:/app/traces-host
      - ./traces:/app/traces-fallback

